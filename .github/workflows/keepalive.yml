# Render 무료 서버는 15분 동안 요청이 없으면 잠든다.
# 테스트 기간에는 14분마다 깨워서 첫 접속이 느리지 않게 한다. 필요 없으면 Actions 에서 이 워크플로를 끄면 된다.
name: Keep server awake

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: config
      - run: curl -fsS --max-time 90 "$(tr -d '[:space:]' < config/server_url.txt)/health" || true
